name: Feature request
description: Suggest a feature or improvement for the current product
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/idodavis/paradox-modding-tools/blob/main/ROADMAP.md)
        and the [supported systems](https://github.com/idodavis/paradox-modding-tools#supported-os)
        first.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want?
    validations:
      required: true

  - type: textarea
    id: why-useful
    attributes:
      label: Why this would be useful
      description: How would this help you or other modders?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Library
        - New workspace
        - IDE
        - Source control
        - Wiki pane
        - Event Graph
        - Health
        - Patch Notes
        - Publish / Steam Workshop
        - Settings
        - Appearance / themes
        - Language / scan / cache
        - Build / updater
        - Other
    validations:
      required: true

  - type: input
    id: area-other
    attributes:
      label: If you selected Other, specify

  - type: dropdown
    id: roadmap
    attributes:
      label: Roadmap bucket
      description: Closest match if this is a larger ask.
      options:
        - Patching / retarget after a game update
        - GUI preview
        - Map editor
        - Multi-window
        - Game coverage
        - Other / polish
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Crusader Kings III
        - Victoria 3
        - Europa Universalis V
        - All / not game-specific
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other ways to handle this.
