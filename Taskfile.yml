version: "3"

vars:
  APP_NAME: "paradox-modding-tools"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run, and the platform Taskfile the tasks below dispatch to: the
  # host OS unless `wails3 build GOOS=...` or the GOOS env var sets it for cross-compilation.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          VERSION: "{{.VERSION}}"
          DEV: "{{.DEV}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"
          OBFUSCATED: "{{.OBFUSCATED}}"
          GARBLE_ARGS: "{{.GARBLE_ARGS}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          VERSION: "{{.VERSION}}"
          FORMAT: "{{.FORMAT}}"
          INSTALL_SCOPE: "{{.INSTALL_SCOPE}}"
          CERT_PATH: "{{.CERT_PATH}}"
          PUBLISHER: "{{.PUBLISHER}}"
          USE_MSIX_TOOL: "{{.USE_MSIX_TOOL}}"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"
        vars:
          VERSION: "{{.VERSION}}"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  test:
    summary: Fast backend tests. Skips the real-install tier.
    dir: services
    cmds:
      # -timeout 60s is the contract: a test that needs longer belongs behind an opt-in task, so
      # move the test, do not raise the number
      - go test -short -timeout 60s ./...

  test:race:
    summary: >
      What CI runs. The race detector is the only thing that can catch a
      lock-discipline regression, and GLOSSARY makes that discipline binding on
      every consolidation. Keep this identical to .github/workflows/test.yml.
    dir: services
    cmds:
      - go test -short -race -timeout 60s ./...

  check:
    summary: Everything a commit must pass, Go and frontend. Run it before every commit.
    cmds:
      - task: check:go
      - task: check:frontend

  check:go:
    summary: gofmt, the three vets, staticcheck, golangci-lint and the short tests.
    cmds:
      - test -z "$(gofmt -l main.go services)"
      # plain vet skips the files of other systems; these two cover them
      - go vet ./...
      - GOOS=linux go vet ./services/internal/...
      - GOOS=windows go vet ./services/internal/...
      - staticcheck ./...
      - golangci-lint run ./...
      - task: test

  check:frontend:
    summary: The typecheck (~30s, .vue files included), eslint with prettier, and vitest.
    dir: frontend
    cmds:
      - task: check:types
      - npm run lint
      - npm test

  check:types:
    summary: >
      Type-check the frontend, .vue files included (~30s). vue-tsc wraps the
      JavaScript tsc, which TypeScript 7 no longer ships, so it drives the
      `tsc-js` alias instead — see frontend/scripts/check.mjs.
    dir: frontend
    cmds:
      - npm run check

  test:gate:
    summary: >
      The real-install tier: the source and vanilla diagnostics gates over
      CK3, Victoria 3 and EU5. Each of them skips under
      -short and again when its own variable is unset, so dropping -short is
      not what turns the tier on — these variables are. Set
      PMT_TEST_INSTALL_{CK3,VIC3,EU5} to the three game roots; the console
      dumps are read from each game's Documents folder.
    dir: services
    env:
      PMT_SOURCE_GATE: 1
      PMT_VANILLA_GATE: 1
    cmds:
      # not 60s: each gate here scans three real installs
      - go test -count=1 -timeout 1800s ./...

  test:full:
    summary: The real-install gates and then the frontend typecheck. What to run before a commit that touches the engine.
    cmds:
      - task: test:gate
      - task: check:types

  test:sweep:
    summary: >
      The engine's scoreboard, not a gate: every mod a game's Documents mod
      folder lists is opened over that install, and the health report, the
      findings and the hover answer rate are printed. It asserts nothing, so a
      count that moves is news and never a failure. Needs
      PMT_TEST_INSTALL_<GAME> and PMT_TEST_MODS_<GAME>, and takes minutes per
      game; PMT_TEST_SWEEP keeps it out of every other task.
    dir: services
    env:
      PMT_TEST_SWEEP: 1
    cmds:
      - go test -count=1 -v -run TestSweep -timeout 60m .
