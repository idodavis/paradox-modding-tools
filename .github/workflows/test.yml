# Gate every PR to main on a full build, the backend tests and the frontend typecheck. -race is the only thing
# that catches a lock-discipline regression. The real-install tier needs the three games
# installed, so its gates stay manual: `task test:gate`.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and Go tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux GTK4 / WebKitGTK 6
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # the full build a release makes: the frontend, the bindings and the app
      - name: Build
        run: |
          set -euo pipefail
          wails3 task linux:build
          test -f bin/paradox-modding-tools

      - name: gofmt
        run: |
          set -euo pipefail
          out="$(gofmt -l main.go internal services)"
          if [ -n "${out}" ]; then
            echo "::error::gofmt needed on:"; echo "${out}"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -timeout 60s is the contract: move a test that needs longer, do not raise the number
      - name: go test -race
        run: go test -short -race -timeout 60s ./...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check
