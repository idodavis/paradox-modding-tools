# The Linux package spec; see https://nfpm.goreleaser.com

name: "paradox-modding-tools.exe"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "A paradox-modding-tools application"
vendor: "idavis.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/paradox-modding-tools"
    dst: "/usr/local/bin/paradox-modding-tools"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/paradox-modding-tools.png"
  - src: "./build/linux/paradox-modding-tools.desktop"
    dst: "/usr/share/applications/paradox-modding-tools.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# A build with -tags gtk3 (the legacy WebKit2GTK 4.1 stack, supported through Wails v3.0.x,
# removed in v3.1) replaces the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
