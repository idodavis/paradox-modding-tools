# Zip Windows/Linux builds on main pushes that change more than Markdown. Tag only after every matrix cell succeeds.
name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: Override version (e.g. v0.5.0). Empty = auto patch-bump, floor v0.4.0.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version }}"
          if [[ -n "${raw}" ]]; then
            ver="${raw#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          floor="0.4.0"
          if [[ -z "${latest}" ]]; then
            next="${floor}"
          else
            ver="${latest#v}"
            IFS=. read -r maj min pat _ <<< "${ver}."
            maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
            if [[ "${maj}" -eq 0 && "${min}" -lt 4 ]]; then
              next="${floor}"
            else
              next="${maj}.${min}.$((pat + 1))"
            fi
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "next ${next} (latest tag: ${latest:-none})"

  build:
    needs: version
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            task: windows:build
            binary: paradox-modding-tools.exe
            zip: paradox-modding-tools-windows-amd64.zip
          - goos: linux
            goarch: amd64
            task: linux:build
            binary: paradox-modding-tools
            zip: paradox-modding-tools-linux-amd64.zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux GTK4 / WebKitGTK 6
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.zip }}
        run: |
          set -euo pipefail
          wails3 task "${{ matrix.task }}" \
            VERSION="${{ needs.version.outputs.version }}" \
            ARCH="${{ matrix.goarch }}"
          test -f "bin/${{ matrix.binary }}"

      - name: Zip binary + LICENSE + README.txt
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "bin/${{ matrix.binary }}" "${stage}/"
          cp LICENSE "${stage}/"
          printf '%s\n' \
            'Paradox Modding Tools' \
            'https://github.com/idodavis/paradox-modding-tools' \
            '' \
            'Extract this folder and run the binary.' \
            'Windows needs WebView2 (Windows 11 usually has it).' \
            'Linux needs GTK 4 and WebKitGTK 6 runtime libraries.' \
            '' \
            'Steam Workshop publish requires the Steam client, signed in as' \
            'the Workshop owner, with the game installed.' \
            '' \
            'License: GPL-3.0-or-later (see LICENSE).' \
            > "${stage}/README.txt"
          (cd "${stage}" && zip -9 "${GITHUB_WORKSPACE}/${{ matrix.zip }}" \
            "${{ matrix.binary }}" LICENSE README.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum paradox-modding-tools-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
