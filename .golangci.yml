version: "2"

run:
  go: "1.27"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gocritic
    - nestif
    - funlen
    - goconst
    - misspell
  settings:
    revive:
      rules:
        - name: exported
        - name: receiver-naming
        - name: var-naming
        - name: error-strings
    nestif:
      min-complexity: 4
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - frontend
    rules:
      # the registry's rows repeat a word as data: two rows naming one database are two facts
      - path: internal/game/lang-rules\.go
        linters: [goconst]
      # the format table's rows repeat a word as data
      - path: internal/inventory/inventory\.go
        linters: [goconst]

formatters:
  enable:
    - gofmt

issues:
  # Findings already in the code at the restructure's baseline wait for their stage. A stage reads
  # its files' whole list with --new-from-rev= (empty).
  new-from-rev: 517e3c7
