# Gate every PR to main on the backend tests and the frontend typecheck. -race is the only thing
# that catches a lock-discipline regression. The real-install tier needs the three games
# installed, so the PMT_*_GATE gates and the sweep stay manual: `task test:gate`, `task test:sweep`.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"

      - name: gofmt
        run: |
          set -euo pipefail
          out="$(gofmt -l services)"
          if [ -n "${out}" ]; then
            echo "::error::gofmt needed on:"; echo "${out}"; exit 1
          fi

      - name: go vet
        working-directory: services
        run: go vet ./...

      # -timeout 60s is the contract: move a test that needs longer, do not raise the number
      - name: go test -race
        working-directory: services
        run: go test -short -race -timeout 60s ./...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check
