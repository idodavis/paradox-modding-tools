version: "3"

vars:
  APP_NAME: "paradox-modding-tools"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          VERSION: "{{.VERSION}}"
          DEV: "{{.DEV}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"
          OBFUSCATED: "{{.OBFUSCATED}}"
          GARBLE_ARGS: "{{.GARBLE_ARGS}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          VERSION: "{{.VERSION}}"
          FORMAT: "{{.FORMAT}}"
          INSTALL_SCOPE: "{{.INSTALL_SCOPE}}"
          CERT_PATH: "{{.CERT_PATH}}"
          PUBLISHER: "{{.PUBLISHER}}"
          USE_MSIX_TOOL: "{{.USE_MSIX_TOOL}}"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"
        vars:
          VERSION: "{{.VERSION}}"

  dev:
    summary: Runs the application in development mode
    deps:
      - task: common:build:steamugc
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  test:
    summary: Fast backend tests (~3s). Skips the real-install tier.
    dir: services
    cmds:
      # -timeout 60s is the contract, not a safety net: a test that needs longer
      # than a minute belongs behind an opt-in task, not in the loop a developer
      # runs on every change. If this starts failing, move the test — do not
      # raise the number.
      - go test -short -timeout 60s ./...

  test:race:
    summary: >
      What CI runs (~9s). The race detector is the only thing that can catch a
      lock-discipline regression, and GLOSSARY makes that discipline binding on
      every consolidation. Keep this identical to .github/workflows/test.yml.
    dir: services
    cmds:
      - go test -short -race -timeout 60s ./...

  check:
    summary: >
      Type-check the frontend, .vue files included (~30s). vue-tsc wraps the
      JavaScript tsc, which TypeScript 7 no longer ships, so it drives the
      `tsc-js` alias instead — see frontend/scripts/check.mjs.
    dir: frontend
    cmds:
      - npm run check

  test:full:
    summary: >
      Backend tests including the real-install tier (~30s). Needs
      PMT_TEST_INSTALL_{CK3,VIC3,EU5} and PMT_TEST_DOCS_{CK3,VIC3,EU5}. Unlike
      `task test`, these now FAIL rather than skip when those are unset —
      PMT_TEST_TIER=full says the corpus tier was asked for, and a tier that can
      silently be empty is not a tier. Use `task test` if you do not have the
      installs.
    dir: services
    env:
      PMT_TEST_TIER: full
    cmds:
      - go test -timeout 60s ./...
      - task: check

  test:gate:
    summary: >
      The ship condition for every semantic diagnostic: zero findings on the
      game's own script (~20s per game). A check that fires on vanilla is telling
      a modder correct script is wrong. Needs PMT_TEST_INSTALL_{CK3,VIC3,EU5}.
    dir: services
    env:
      PMT_VANILLA_GATE: "1"
    cmds:
      - go test ./internal/views/ -run TestVanillaDiagnosticsClean -v -timeout 30m

  test:probe:
    summary: >
      Engine probes over the real installs and the total conversions (~5min).
      Opt-in and never part of test or test:full. Reports the vanilla orphan
      rate, which is what says how much of the mod residue is engine gap rather
      than mod defect — see GAME-SYNTAX §12.
    dir: services
    env:
      PMT_LOC_RESIDUE: "1"
    cmds:
      - go test ./internal/views/ -run TestVanillaLocResidue -v -timeout 3600s

  test:sweep:
    summary: >
      Engine scoreboard: every Workspace Health check against every workshop mod
      (~9min). Not part of test or test:full. Needs PMT_TEST_INSTALL_{CK3,VIC3,EU5}.
      Counts are for investigation, not targets — see the baseline file. Runs the
      determinism guard alongside, because a count that moves between runs cannot
      be read as a regression either way.
    dir: services
    cmds:
      - go test ./internal/views/ -run 'TestSweep|TestHealthIsDeterministic' -v -timeout 3600s
